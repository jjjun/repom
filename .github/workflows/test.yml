name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CONFIG_HOOK: repom.config_hook:hook_config

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --all-extras --dev --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run pytest
        if: ${{ !cancelled() }}
      - name: Import repom without extras on SQLAlchemy 2.1
        env:
          BASEKIT_NO_SIDE_EFFECTS: "1"
        run: >-
          uv run --no-project --isolated
          --with "sqlalchemy==2.1.8" --with "repom @ ."
          python -c "import repom, repom.models, repom.repositories"
        if: ${{ !cancelled() }}

  # uv.lock pins SQLAlchemy 2.1; repom still supports 2.0, so run the suite on the
  # newest 2.0 release too, without a second lock.
  sqlalchemy-2-0:
    runs-on: ubuntu-latest
    env:
      CONFIG_HOOK: repom.config_hook:hook_config

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --all-extras --dev --locked
      - name: Check that SQLAlchemy 2.0 is the version under test
        run: >-
          uv run --locked --with "sqlalchemy[asyncio]<2.1" python -c
          "import sqlalchemy; assert sqlalchemy.__version__.startswith('2.0.'), sqlalchemy.__version__"
      - run: uv run --locked --with "sqlalchemy[asyncio]<2.1" pytest

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: repom_test
          POSTGRES_USER: repom
          POSTGRES_PASSWORD: repom-ci-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U repom -d repom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONFIG_HOOK: repom.config_hook:hook_config
      EXEC_ENV: test
      DB_TYPE: postgres
      POSTGRES_PASSWORD: repom-ci-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --all-extras --dev --locked
      - run: uv run pytest tests/integration_tests/test_postgres_integration.py
