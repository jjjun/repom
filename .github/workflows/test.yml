name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CONFIG_HOOK: repom.config_hook:hook_config

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --all-extras --dev --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run pytest
        if: ${{ !cancelled() }}

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: repom_test
          POSTGRES_USER: repom
          POSTGRES_PASSWORD: repom-ci-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U repom -d repom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONFIG_HOOK: repom.config_hook:hook_config
      EXEC_ENV: test
      DB_TYPE: postgres
      POSTGRES_PASSWORD: repom-ci-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --all-extras --dev --locked
      - run: uv run pytest tests/integration_tests/test_postgres_integration.py
